# WHAT I HAVE PRODUCED. At most two reach any one message, chosen by overlap with
# the recipient's plan: an output only earns its line when it substantiates the
# contribution being offered. `tags` are skill ids from the extracted taxonomy.
work_lines:
  - text: "um estudo ecológico de séries temporais sobre a letalidade notificada da leptospirose no Brasil, 2007–2025, por região de saúde/ano, com modelagem binomial hierárquica e estrutura espacial"
    tags: [datasus, sinan, epi_design, time_series, spatial_stats, biostatistics, regression, geoprocessing]
  - text: "dois manuscritos de farmacoepidemiologia sobre a dispensação de agonistas de GLP-1 no SNGPC/Anvisa, um nacional e outro com resolução municipal sobre as 5.571 unidades, com integração multibase e aquisição reprodutível"
    tags: [datasus, epi_design, data_management, python, spatial_stats, sql, ibge]
  - text: "o PegaSUS, um motor de descoberta e análise epidemiológica sobre o ecossistema DATASUS/IBGE, que mapeia sistemas, variáveis e a validade temporal de cada campo ao longo das mudanças de esquema"
    tags: [datasus, sim_sinasc, sih_sia, ibge, data_management, sql]
  - text: "um programa de pesquisa em saúde cardiovascular da mulher e cardio-obstetrícia, estruturado como portfólio: priorização por viabilidade, mapeamento de fontes e destino definido para cada linha"
    tags: [systematic_review, meta_analysis, literature_db, epi_design]
  - text: "o CMapDoc, uma aplicação web de mapas conceituais interativos que concebi e implementei sozinho, do front-end à publicação (https://levimelo.github.io/mapdoc/)"
    tags: [web_dev, machine_learning]

