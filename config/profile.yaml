# What outreach emails present as concrete, checkable capability. Kept here in
# your own words rather than generated, because this is the part of a cold email
# a professor actually reads. Keep each line short and specific: a capability
# someone could ask you to demonstrate next week.
# WHO I AM — milestones and standing roles, drawn from `personal/academic_ledger.md`
# (gitignored). Establishes that the work can be trusted to me. Never presented
# as "what I would do on your project": that is `contribution_lines`.
#
# Two canonical corrections from the ledger are load-bearing here and must not
# drift back: the OBMEP result is an honourable mention, NOT a bronze medal; and
# the PIC/HU result is an approved-but-unclassified proposal, NOT a scholarship.
#
# Coursework metrics are deliberately absent. IRA and entrance-exam score measure
# how a student was graded, not what a researcher can do, and quoting them in a
# message whose whole argument is demonstrated capability weakens it. Ordered by
# what a reader should weigh first: standing research roles, then the technical
# base, then formation.
about_lines:
  - "pesquisador bolsista no Núcleo de Excelência em Tecnologias Sociais (NEES/UFAL), como especialista de domínio em sistemas de informação em saúde e no tratamento de bases públicas do SUS"
  - "projeto multicêntrico de reumatologia submetido ao PIC/HU Brasil sob orientação do Prof. Thiago Sotero Fragoso, com UFAL, UFMG, UFRGS e UNICAMP — derivação e validação de uma versão do SLE-DAS sem marcadores sorológicos. Respondo pela arquitetura do protocolo, pela harmonização dos dados entre os centros e pelo desenho estatístico da validação externa"
  - "trabalho corrente em Python e R sobre bases administrativas de saúde — DATASUS, SINAN, SIM, SINASC, SIH/SIA, CNES, SNGPC/Anvisa, IBGE/SIDRA —, com pipelines reprodutíveis, congelamento de fontes e proveniência por SHA-256"
  - "direção científica do IFMSA-UFAL, onde conduzo a capacitação metodológica da equipe em revisão sistemática, metanálise e desenho de estudos; direção de pesquisa do projeto de extensão HEMOMAIS (UNIMA)"
  - "cofundador e diretor de iniciação científica da Liga Acadêmica de Cirurgia Cardiovascular da UFAL; integrante das ligas de Reumatologia, Neurologia e Neurocirurgia, Anestesiologia e Dor, Neurointensivismo e Clínica Médica"
  - "monitor de Bioquímica I (SOI 1) na graduação em Medicina do UNIMA/Afya, onde cursei Medicina antes da transferência para a UFAL"
  - "formação técnica em Eletroeletrônica pelo IFAL — Campus Arapiraca, anterior à Medicina; menção honrosa na OBMEP e na Olimpíada Alagoana de Matemática"

# WHAT I HAVE PRODUCED — artefacts, with their real status. A manuscript in
# preparation is described as such; nothing here is upgraded into a publication.
work_lines:
  - "“Amplitude de detecção e letalidade notificada da leptospirose: estudo ecológico de séries temporais, Brasil, 2007–2025” — manuscrito em preparação. Unidade de análise região de saúde/ano, modelagem binomial hierárquica com estrutura espacial e temporal, e triangulação entre notificação, internação e mortalidade. O argumento é de medida: parte da variação na letalidade notificada reflete qual porção do espectro clínico a vigilância captura, e não apenas a qualidade assistencial"
  - "dois manuscritos de farmacoepidemiologia sobre a dispensação de agonistas do receptor de GLP-1 no SNGPC/Anvisa — um nacional, por UF e região, e outro com resolução municipal sobre as 5.571 unidades, com integração multibase e modelagem espacial. Ambos com aquisição reprodutível, congelamento das fontes e saídas versionadas"
  - "programa científico em saúde cardiovascular da mulher e cardio-obstetrícia, estruturado como portfólio de pesquisa sobre o DATASUS: priorização por valor científico e viabilidade, mapeamento explícito de variáveis e fontes, critérios de descontinuação e destino definido para cada linha"
  - "PegaSUS — motor próprio de descoberta e análise epidemiológica sobre o ecossistema DATASUS/IBGE, com um compêndio que mapeia sistemas, conjuntos, variáveis e a validade temporal de cada campo ao longo das mudanças históricas de esquema"
  - "PULSAR — o sistema que produziu esta mensagem, descrito no relatório em anexo"

