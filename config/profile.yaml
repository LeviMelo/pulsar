# What outreach emails present as concrete, checkable capability. Kept here in
# your own words rather than generated, because this is the part of a cold email
# a professor actually reads. Keep each line short and specific: a capability
# someone could ask you to demonstrate next week.
# WHO I AM — drawn from `personal/academic_ledger.md` (gitignored).
#
# Two canonical corrections from the ledger are load-bearing and must not drift
# back: the OBMEP result is an honourable mention, NOT a bronze medal; and the
# PIC/HU result is an approved-but-unclassified proposal, NOT a scholarship.
#
# Coursework metrics are deliberately absent. IRA and entrance-exam score measure
# how a student was graded, not what a researcher can do.
#
# `identity_line` is the only credential the message states unprompted. Everything
# else is either selected because it bears on the recipient's own plan, or lives
# in the annexes. A catalogue of memberships buries the reason for writing.
identity_line: >-
  estudante do 5º período de Medicina na FAMED/UFAL e pesquisador bolsista no
  NEES/UFAL

# Where the work is actually best spent. Stated once, immediately before the
# offer, because a medical student writing to a lab is otherwise assumed to be
# asking for bench time. "Dois anos" is independent, continuous practice — not a
# formal appointment — so it is phrased as work done rather than a post held.
expertise_note: >-
  O meu trabalho é sobretudo computacional: são dois anos em ciência de dados,
  epidemiologia e computação científica. Rendo mais em projetos que envolvam
  dados — aquisição, tratamento, modelagem, análise e a redação que sai daí — e,
  de modo geral, no que se resolve no computador.

# Reserve, not a script. Nothing here is emitted unless it is selected against
# the recipient's own plan; the SIGAA qualifications field already carries the
# full background and the email must not reproduce it.
about_lines:
  - "pesquisador bolsista no NEES/UFAL, em sistemas de informação em saúde e tratamento de bases públicas do SUS"
  - "projeto multicêntrico de reumatologia no PIC/HU Brasil sob orientação do Prof. Thiago Sotero Fragoso, com UFAL, UFMG, UFRGS e UNICAMP"
  - "direção científica do IFMSA-UFAL e do projeto de extensão HEMOMAIS (UNIMA)"
  - "cofundador e diretor de iniciação científica da Liga Acadêmica de Cirurgia Cardiovascular da UFAL"
  - "monitor de Bioquímica I na graduação em Medicina do UNIMA/Afya"
  - "formação técnica em Eletroeletrônica pelo IFAL — Campus Arapiraca; menção honrosa na OBMEP e na Olimpíada Alagoana de Matemática"

