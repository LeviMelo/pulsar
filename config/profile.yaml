# WHAT IS ATTACHED. One list, because the annexes ARE the recent work: keeping a
# separate "recent output" list only invited the two to disagree about what the
# professor would actually find in the message.
#
# Every message names all four. `tags` decide only which one gets pointed at as
# closest to the recipient's plan; an annex the plan has nothing to do with is
# still worth offering, and hiding it made a productive week look like one paper.
#
# Tags list what makes a document DISTINCTIVE, not everything it contains. All
# four use biostatistics, regression and epidemiological design, so listing those
# matched a plant-physiology plan against the leptospirosis paper on the strength
# of the word "bioestatística" alone. Broad methods belong in
# `contribution_by_skill`, which is about what the student can do; tags exist to
# tell two of his own papers apart.
#
# `recent` is true where the document's own printed date falls in the current
# week. It is what licenses "3 deles escritos nesta semana", and every one of
# those dates is checkable inside the PDF, so it must be maintained honestly:
#   relatório PULSAR 04/09 · GLP-1 nacional 02/09 · GLP-1 municipal 01/09
#   leptospirose 14/08 — older, and therefore flagged false.
annexes:
  - key: lepto
    short: "leptospirose no Brasil (2007–2025)"
    blurb: "um estudo ecológico de séries temporais por região de saúde, com modelagem binomial hierárquica e estrutura espacial"
    label: "Leptospirose no Brasil, 2007–2025 — estudo ecológico de séries temporais por região de saúde/ano, com modelagem binomial hierárquica e estrutura espacial"
    recent: false
    tags: [sinan, time_series, spatial_stats, geoprocessing]
  - key: glp1_nacional
    short: "agonistas de GLP-1 no SNGPC/Anvisa"
    blurb: "farmacoepidemiologia nacional, por UF e região"
    label: "Agonistas de GLP-1 no SNGPC/Anvisa — farmacoepidemiologia nacional, por UF e região"
    recent: true
    tags: [datasus, python, sql]
  - key: glp1_municipal
    short: "agonistas de GLP-1 com resolução municipal"
    blurb: "o mesmo desenho sobre as 5.571 unidades, com integração multibase e modelagem espacial"
    label: "Agonistas de GLP-1 no SNGPC/Anvisa — o mesmo desenho com resolução municipal, sobre as 5.571 unidades, com integração multibase e modelagem espacial"
    recent: true
    tags: [ibge, spatial_stats, geoprocessing]
  - key: pulsar
    short: "o relatório técnico do PULSAR"
    blurb: "construção do corpus, estrutura temática e a avaliação de recuperação"
    label: "Relatório técnico do PULSAR — construção do corpus, estrutura temática e a avaliação de recuperação"
    recent: true
    tags: [machine_learning, web_dev, literature_db]

# WHERE TO REPLY. The institutional account cannot issue an app password, so the
# message is submitted from a personal address and the From line says so. Reply-To
# is set to the institutional address in config/local.toml, so a plain reply lands
# correctly — but the discrepancy is visible to the recipient, and a cold email
# that appears to misrepresent its sender is worse than one that explains itself.
sending_note: >-
  Esta mensagem sai do meu endereço pessoal por limitação do e-mail institucional;
  para responder, prefira o endereço da FAMED acima.
contacts:
  - address: "levi.amorim@famed.ufal.br"
    purpose: "para esta candidatura e para iniciação científica"
  - address: "levi.amorim@nees.ufal.br"
    purpose: "para outros assuntos acadêmicos ou técnicos"

# The works paragraph. One sentence, not a catalogue: the four manuscripts are
# attached anyway, so the message names the one that bears on this plan and lets
# the rest be found. The links follow in the same breath, stated rather than
# defended -- "escrevo eu mesmo todo o codigo" read as though the recipient were
# expected to suspect the projects were not his.
works_tail: >-
  Desenvolvi também o CMapDoc, uma aplicação web de mapas conceituais interativos
  ({cmapdoc}), e o código do PULSAR e dos demais projetos está no meu GitHub ({github}).
links:
  - key: cmapdoc
    url: "https://levimelo.github.io/mapdoc/"
  - key: github
    url: "https://github.com/LeviMelo"

# Sent verbatim to SIGAA when an application is explicitly confirmed.
qualifications_text: |-
  Sou acadêmico de Medicina da Universidade Federal de Alagoas (UFAL), com atuação em iniciação científica e pesquisa aplicada nas interfaces entre epidemiologia, ciência de dados, informática em saúde e pesquisa clínica. Atuo como pesquisador no Núcleo de Excelência em Tecnologias Sociais (NEES/UFAL), como especialista de domínio em sistemas de informação em saúde, com atuação na modelagem e no tratamento de dados provenientes das bases públicas do SUS. Exerço a direção de pesquisa do IFMSA-UFAL — onde conduzo a capacitação metodológica da equipe em revisões sistemáticas e metanálises —, do projeto de extensão HEMOMAIS (UNIMA) e da Liga Acadêmica de Cirurgia Cardiovascular da UFAL, da qual sou cofundador, além de integrar ligas de Reumatologia, Neurologia e Neurocirurgia, Anestesiologia, Neurointensivismo e Clínica Médica.

  Tenho experiência na concepção e estruturação de projetos científicos, revisão de literatura, elaboração de protocolos, construção e gerenciamento de bases de dados, análise estatística, visualização e interpretação de resultados, redação científica e submissão de trabalhos. Como exemplo recente, participo de projeto multicêntrico de reumatologia (derivação e validação de uma versão do SLE-DAS sem marcadores sorológicos para aferição de atividade do lúpus eritematoso sistêmico), conduzido no PIC/HU Brasil sob orientação do Prof. Thiago Sotero Fragoso, no qual respondi pela harmonização dos dados dos centros participantes e pelo desenho estatístico da validação; também presto revisão metodológica a estudos ecológicos com dados do SINAN, envolvendo análise de tendência temporal e autocorrelação espacial.

  Possuo domínio de Python e R e experiência com automação de fluxos de pesquisa, processamento de grandes bases públicas — especialmente DATASUS, SIDRA e demais fontes do SUS —, análises epidemiológicas e espaciais e desenvolvimento de ferramentas computacionais voltadas à pesquisa, incluindo a arquitetura de um motor próprio de integração e análise espaço-temporal de dados de saúde pública. Minha formação técnica prévia em Eletroeletrônica pelo IFAL e a participação em olimpíadas científicas (menção honrosa na OBMEP e na Olimpíada Alagoana de Matemática) complementam esse perfil com raciocínio quantitativo e resolução estruturada de problemas. Meus interesses concentram-se em reumatologia, neurologia, anestesiologia, medicina cardiovascular, epidemiologia e aplicações de ciência de dados e inteligência artificial à saúde. Considero como principais atributos para atividades de pesquisa a autonomia para aprender e implementar métodos novos, a capacidade de transitar entre problemas clínicos e quantitativos e a experiência em transformar questões de pesquisa em protocolos, análises e produtos científicos concretos.

