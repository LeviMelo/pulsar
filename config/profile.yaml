  - "conduzir a análise estatística — desenho, modelagem de regressão, séries temporais e análise espacial — em Python ou R, de forma reprodutível"
  - "estruturar a revisão de literatura e redigir o protocolo, com a estratégia de busca documentada"
  - "automatizar a extração e o processamento de bases públicas quando o projeto as utilizar (DATASUS, SINAN, SIH/SIA, SIM/SINASC, SIDRA, IBGE)"
  - "preparar figuras, tabelas e o texto para submissão, e manter a documentação do estudo"

