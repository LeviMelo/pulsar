# message is submitted from a personal address and the From line says so. Reply-To
# is set to the institutional address in config/local.toml, so a plain reply lands
# correctly — but the discrepancy is visible to the recipient, and a cold email
# that appears to misrepresent its sender is worse than one that explains itself.
