# What outreach emails present as concrete, checkable capability. Kept here in
# your own words rather than generated, because this is the part of a cold email
# a professor actually reads. Keep each line short and specific: a capability
# someone could ask you to demonstrate next week.
# WHO I AM — drawn from `personal/academic_ledger.md` (gitignored).
#
# Two canonical corrections from the ledger are load-bearing and must not drift
# back: the OBMEP result is an honourable mention, NOT a bronze medal; and the
# PIC/HU result is an approved-but-unclassified proposal, NOT a scholarship.
#
# Coursework metrics are deliberately absent. IRA and entrance-exam score measure
# how a student was graded, not what a researcher can do.
#
# `identity_line` is the only credential the message states unprompted. Everything
# else is either selected because it bears on the recipient's own plan, or lives
# in the annexes. A catalogue of memberships buries the reason for writing.
identity_line: >-
  estudante do 5º período de Medicina na FAMED/UFAL e membro do
  NEES/UFAL

# Where the work is actually best spent. Stated once, immediately before the
# offer, because a medical student writing to a lab is otherwise assumed to be
# asking for bench time. "Dois anos" is independent, continuous practice — not a
# formal appointment — so it is phrased as work done rather than a post held.
expertise_note: >-
  Trabalho há dois anos com ciência de dados, epidemiologia e computação científica.
offer_prompt: "Se for útil ao projeto, eu poderia contribuir mais diretamente nestas frentes:"

# The message has to end going somewhere. It used to end on the disclaimer
# about machine-written lines, which meant the last thing a reader carried
# away was "some of this may be wrong".
closing_line: >-
  Se a vaga ainda estiver aberta, fico à disposição para conversar sobre o plano.

contribution_texts:
  stats: "a análise estatística, do desenho ao ajuste dos modelos e à checagem de pressupostos"
  temporal: "a análise de tendência temporal, incluindo a correção de autocorrelação serial"
  spatial: "a análise espacial — autocorrelação, varredura de clusters e os mapas do artigo"
  sus: "a extração e o tratamento das bases do SUS, com congelamento das fontes e proveniência por SHA-256"
  denominators: "o levantamento e a normalização dos denominadores populacionais e da malha geográfica"
  review: "a estruturação da revisão sistemática: busca documentada, triagem em duplicata e extração"
  meta: "a metanálise, incluindo heterogeneidade, análise de subgrupos e viés de publicação"
  design: "a operacionalização do desenho: desfechos, critérios de elegibilidade e plano de análise por escrito"
  ml: "a implementação e a validação dos modelos, com avaliação fora da amostra"
  database: "a construção e a curadoria da base de dados, da integração das fontes ao controle de qualidade"
  frontend: "a interface ou o painel de exploração dos resultados"
  writing: "a preparação das figuras, das tabelas e do texto para submissão"

