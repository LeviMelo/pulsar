# What outreach emails present as concrete, checkable capability. Kept here in
# your own words rather than generated, because this is the part of a cold email
# a professor actually reads. Keep each line short and specific: a capability
# someone could ask you to demonstrate next week.
# WHO I AM — drawn from `personal/academic_ledger.md` (gitignored).
#
# Two canonical corrections from the ledger are load-bearing and must not drift
# back: the OBMEP result is an honourable mention, NOT a bronze medal; and the
# PIC/HU result is an approved-but-unclassified proposal, NOT a scholarship.
#
# Coursework metrics are deliberately absent. IRA and entrance-exam score measure
# how a student was graded, not what a researcher can do.
#
# `identity_line` is the only credential the message states unprompted. Everything
# else is either selected because it bears on the recipient's own plan, or lives
