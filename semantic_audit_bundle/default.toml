[paths]
data_dir = "data"
database = "data/pulsar.duckdb"
public_dataset_dir = "data/public_sigaa"
legacy_ledger_json = "projects_ledger.json"
legacy_ledger_csv = "projects_ledger.csv"
professors_csv = "professores_ufal.csv"
profile_yaml = "config/profile.yaml"

[sigaa]
headless = false
public_delay_seconds = 0.85
public_detail_depth = 1
public_max_detail_pages = 200

[[sigaa.centers]]
name = "FACULDADE DE MEDICINA"
code = "849"
slug = "FAMED"

[[sigaa.centers]]
name = "INSTITUTO DE CIÊNCIAS BIOLÓGICAS E DA SAÚDE"
code = "854"
slug = "ICBS"

[analysis]
word_max_features = 18000
char_max_features = 18000
lsa_components = 64
nmf_topics = 8
clusters = 8
weight_lsa = 0.55
weight_tfidf = 0.25
weight_bm25 = 0.20
max_professor_text_chars = 120000

[smtp]
host = ""
port = 587
starttls = true
ssl = false
username_env = "PULSAR_SMTP_USER"
password_env = "PULSAR_SMTP_PASSWORD"
from_address = ""
from_name = ""
reply_to = ""
rate_limit_seconds = 1.0
