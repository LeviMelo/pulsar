# The working environment on the primary machine is the conda env `pegasus`
# (Python 3.11). This file reproduces it from scratch elsewhere.
name: pegasus
channels:
  - conda-forge
dependencies:
  - python=3.11
  - beautifulsoup4
  - charset-normalizer
  - duckdb
  - ftfy
  - httpx
  - jinja2
  - joblib
  - numpy
  - pandas
  - pyarrow
  - pyyaml
  - requests
  - rich
  - scikit-learn
  - scipy
  - streamlit
  - typer
  - pytest
  - pip
  - pip:
      - json5
      - playwright
